        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
            import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
          
            const firebaseConfig = {
              apiKey: "AIzaSyAWItC0B8LSmHwd3j23vjkRbYbz6AmqHLA",
              authDomain: "bs-archieve.firebaseapp.com",
              databaseURL: "https://bs-archieve-default-rtdb.firebaseio.com",
              projectId: "bs-archieve",
              storageBucket: "bs-archieve.appspot.com",
              messagingSenderId: "902571322512",
              appId: "1:902571322512:web:da19c1f05b3b6a252bbc15",
              measurementId: "G-993RZ9J66H"
            };
          
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
          
            // Unique comment thread based on page URL
            const threadId = window.location.pathname;
            const commentsRef = collection(db, "comments", threadId, "messages");
          
            // Toggle comment section visibility
            document.getElementById("toggleComments").addEventListener("click", () => {
              const container = document.getElementById("commentsContainer");
              container.style.display = container.style.display === "none" ? "block" : "none";
            });
          
            // Handle form submission
            document.getElementById("commentForm").addEventListener("submit", async (e) => {
              e.preventDefault();
              const name = document.getElementById("nameInput").value.trim();
              const content = document.getElementById("commentInput").value.trim();
              if (!name || !content) return;
          
              await addDoc(commentsRef, {
                name,
                content,
                createdAt: serverTimestamp()
              });
          
              document.getElementById("nameInput").value = "";
              document.getElementById("commentInput").value = "";
            });
          
            // Render comments in real-time
            const q = query(commentsRef, orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
              const list = document.getElementById("commentList");
              list.innerHTML = "";
              snapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement("li");
                li.className = "comment-item";
                li.innerHTML = `
                  <div class="comment-card">
                    <div class="comment-name">${data.name}</div>
                    <div class="comment-content">${data.content}</div>
                  </div>
                `;
                list.appendChild(li);
              });
            });
          </script>
