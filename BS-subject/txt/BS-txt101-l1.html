<div id="commentsContainer" style="display: block;">
  <h2>Comments</h2>

        <script type="module">
            // Import the functions you need from the SDKs you need
            import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
            import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js";
            // TODO: Add SDKs for Firebase products that you want to use
            // https://firebase.google.com/docs/web/setup#available-libraries
          
            // Your web app's Firebase configuration
            // For Firebase JS SDK v7.20.0 and later, measurementId is optional
            const firebaseConfig = {
              apiKey: "AIzaSyAWItC0B8LSmHwd3j23vjkRbYbz6AmqHLA",
              authDomain: "bs-archieve.firebaseapp.com",
              databaseURL: "https://bs-archieve-default-rtdb.firebaseio.com",
              projectId: "bs-archieve",
              storageBucket: "bs-archieve.firebasestorage.app",
              messagingSenderId: "902571322512",
              appId: "1:902571322512:web:da19c1f05b3b6a252bbc15",
              measurementId: "G-993RZ9J66H"
            };
          
            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const analytics = getAnalytics(app);
          
          




             // Unique thread per page using the path
            const threadId = window.location.pathname;
            const commentsRef = collection(db, "comments", threadId, "messages");

            // Show/hide button
            document.getElementById("toggleComments").addEventListener("click", () => {
                const container = document.getElementById("commentsContainer");
                container.style.display = container.style.display === "none" ? "block" : "none";
            });

            // Handle comment submission
            document.getElementById("commentForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const name = document.getElementById("nameInput").value.trim();
                const content = document.getElementById("commentInput").value.trim();
                if (!name || !content) return;

                await addDoc(commentsRef, {
                name,
                content,
                createdAt: serverTimestamp()
                });

                document.getElementById("nameInput").value = "";
                document.getElementById("commentInput").value = "";
            });

            // Real-time comment display
            const q = query(commentsRef, orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById("commentList");
                list.innerHTML = "";
                snapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement("li");
                li.innerHTML = `<strong>${data.name}</strong>: ${data.content}`;
                list.appendChild(li);
                });
            });
        </script>
